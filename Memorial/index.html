<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לזכרם של סבא וסבתא</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#f3f4f6">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600&display=swap');
        body { font-family: 'Heebo', sans-serif; }
        .fade-in { animation: fadeIn 1.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* פס גלילה */
        .messages-container::-webkit-scrollbar { width: 6px; }
        .messages-container::-webkit-scrollbar-thumb { background-color: #d6d3d1; border-radius: 10px; }
    </style>
</head>
<body class="bg-stone-50 text-gray-800 antialiased selection:bg-stone-300">

    <div class="max-w-2xl mx-auto bg-white min-h-screen shadow-2xl overflow-hidden pb-10">
        
        <!-- Header Section - כאן התמונה המשפחתית נכנסת -->
        <div class="relative h-72 md:h-96 flex justify-center items-end pb-8 bg-stone-800" style="background-image: url('bg.jpg'); background-size: cover; background-position: center 30%;">
            <!-- שכבת השחרה עדינה כדי שהתמונה העגולה והטקסט לא ילכו לאיבוד -->
            <div class="absolute inset-0 bg-stone-900 opacity-20"></div>
            
            <!-- תמונה ראשית עגולה של סבא וסבתא (שנה את שם הקובץ ל-main.jpg) -->
            <img src="main.jpg" alt="סבא וסבתא" class="absolute -bottom-16 w-36 h-36 rounded-full border-4 border-white shadow-lg object-cover z-10 bg-white" onerror="this.style.display='none'">
        </div>

        <!-- Info Section -->
        <div class="pt-24 px-8 text-center fade-in">
            <h1 class="text-3xl font-semibold text-stone-900 mb-2">שושנה סוזן ויהודה סבג ז"ל</h1>
            <h2 class="text-xl text-stone-600 font-medium mb-4">ז'אז'ו ובאבא יהודה</h2>
            <p class="text-stone-500 font-light mb-6">"כאן יופיע משפט משותף, תאריכים או ציטוט..."</p>
        </div>

        <div class="px-8 py-10 space-y-12">
            
            <!-- Timeline / Biography -->
            <section>
                <h2 class="text-xl font-semibold text-stone-800 mb-6 border-b border-stone-200 pb-2">סיפור חיים</h2>
                <div class="relative border-r-2 border-stone-200 pr-6 space-y-6 text-right" id="bio-section">
                    <div class="relative">
                        <div class="absolute -right-[31px] bg-stone-400 w-4 h-4 rounded-full border-4 border-white"></div>
                        <h3 class="font-semibold text-stone-800">תחנה ראשונה</h3>
                        <p class="text-gray-600 text-sm mt-1">בקרוב נמלא כאן את הפרטים...</p>
                    </div>
                </div>
            </section>

            <!-- Media Gallery -->
            <section>
                <h2 class="text-xl font-semibold text-stone-800 mb-6 border-b border-stone-200 pb-2">גלריית זיכרונות</h2>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <!-- תמונות הגלריה - ודא שיש קבצים בשם pic1.jpg ו-pic2.jpg בתיקייה -->
                    <img src="pic1.jpg" class="rounded-lg shadow-sm hover:shadow-md transition-shadow duration-300 object-cover h-32 w-full bg-stone-100" alt="זיכרון 1" onerror="this.style.display='none'">
                    <img src="pic2.jpg" class="rounded-lg shadow-sm hover:shadow-md transition-shadow duration-300 object-cover h-32 w-full bg-stone-100" alt="זיכרון 2" onerror="this.style.display='none'">
                </div>
            </section>

            <!-- Digital Candle -->
            <section class="text-center bg-stone-50 py-8 rounded-xl border border-stone-100 shadow-inner">
                <button id="candleBtn" class="bg-stone-800 text-white px-8 py-3 rounded-full shadow-lg hover:bg-stone-700 transition-colors duration-300 flex items-center justify-center mx-auto space-x-2 space-x-reverse font-semibold">
                    <span class="text-xl">🕯️</span>
                    <span>הדלק נר לזכרם</span>
                </button>
                <p id="candleCount" class="text-sm text-stone-500 mt-4">טוען נתונים...</p>
            </section>

            <!-- Guestbook -->
            <section>
                <h2 class="text-xl font-semibold text-stone-800 mb-6 border-b border-stone-200 pb-2">ספר מבקרים וזיכרונות</h2>
                
                <form id="messageForm" class="mb-8 space-y-4">
                    <input type="text" id="senderName" placeholder="השם שלך" required class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-stone-500 bg-white">
                    <textarea id="messageText" placeholder="כתוב זיכרון משותף, הקדשה או מילה טובה..." required rows="3" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-stone-500 bg-white"></textarea>
                    <button type="submit" class="w-full bg-stone-600 text-white px-4 py-2 rounded-lg hover:bg-stone-500 transition duration-300 font-semibold">שלח הקדשה</button>
                </form>

                <div id="messagesList" class="space-y-4 max-h-96 overflow-y-auto messages-container pr-2"></div>
            </section>

        </div>
    </div>

    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-analytics-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC6s7EJsjvHkAY4AhoMSF12RMoiFg1QhLo",
            authDomain: "mamo2026-29b4a.firebaseapp.com",
            databaseURL: "https://mamo2026-29b4a-default-rtdb.firebaseio.com",
            projectId: "mamo2026-29b4a",
            storageBucket: "mamo2026-29b4a.firebasestorage.app",
            messagingSenderId: "68494818133",
            appId: "1:68494818133:web:af01710f1f1264d2174ddc",
            measurementId: "G-G2BTS6YKMH"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const analytics = firebase.analytics();

        // Candle Logic
        const candleCountRef = db.ref('candleCount');
        const candleText = document.getElementById('candleCount');
        const candleBtn = document.getElementById('candleBtn');
        let hasLitCandle = localStorage.getItem('candleLit') === 'true';

        if (hasLitCandle) setCandleLitUI();

        candleCountRef.on('value', (snapshot) => {
            const count = snapshot.val() || 0;
            candleText.innerText = `${count} אנשים הדליקו נר לזכרם`;
        });

        candleBtn.addEventListener('click', () => {
            if (hasLitCandle) return;
            candleCountRef.set(firebase.database.ServerValue.increment(1)).then(() => {
                hasLitCandle = true;
                localStorage.setItem('candleLit', 'true');
                setCandleLitUI();
            });
        });

        function setCandleLitUI() {
            candleBtn.innerHTML = "<span class='text-xl'>🕯️</span><span>הנר שלך דולק</span>";
            candleBtn.classList.remove('bg-stone-800', 'hover:bg-stone-700');
            candleBtn.classList.add('bg-amber-600', 'cursor-default');
        }

        // Guestbook Logic
        const messagesRef = db.ref('messages');
        const messageForm = document.getElementById('messageForm');
        const messagesList = document.getElementById('messagesList');

        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('senderName').value;
            const text = document.getElementById('messageText').value;
            const date = new Date().toLocaleDateString('he-IL');

            messagesRef.push({ name, text, date }).then(() => {
                messageForm.reset();
                alert("תודתנו נתונה לך. ההקדשה נשמרה.");
            });
        });

        messagesRef.on('value', (snapshot) => {
            messagesList.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                const messagesArray = Object.values(data).reverse();
                messagesArray.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = "bg-white p-4 rounded-lg border border-stone-200 shadow-sm";
                    msgDiv.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-semibold text-stone-800">${msg.name}</span>
                            <span class="text-xs text-stone-400">${msg.date}</span>
                        </div>
                        <p class="text-stone-600 text-sm whitespace-pre-wrap">${msg.text}</p>
                    `;
                    messagesList.appendChild(msgDiv);
                });
            } else {
                messagesList.innerHTML = '<p class="text-center text-stone-400 text-sm">היה הראשון לכתוב זיכרון...</p>';
            }
        });
    </script>
</body>
</html>
